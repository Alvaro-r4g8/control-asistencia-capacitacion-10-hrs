<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Control de Asistencia</title>

<script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

<h2>Asistencia Curso de Liderazgo 10 hrs</h2>

<button onclick="iniciarCamara()">
Activar cámara
</button>
  
<div id="reader" style="width:350px;"></div>

<h3 id="resultado"></h3>

<div id="detalle"></div>

<script>
  
const URL_API =
"https://script.google.com/macros/s/AKfycbzTgCn8MqS0Tn6gR55QHNxckAS96JR_SvbiEKO8CvkDbafLqPkxaqiktcv518ULlE47/exec";

async function probarAPI() {

  alert("Entré a probarAPI");

  try {

    const resp = await fetch(
      URL_API,
      {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id: "CAP001"
        })
      }
    );

    alert("Petición enviada");

  } catch(err) {

    alert(
      err.name +
      "\n\n" +
      err.message
    );

  }

}
  
let iniciado = false;

let ultimoEscaneo = "";
let ultimoTiempo = 0;  

async function iniciarCamara() {

  if(iniciado) return;

  iniciado = true;

  const qr =
    new Html5Qrcode("reader");

  try {

  await qr.start(
  {
    facingMode:"environment"
  },
  {
    fps:10,
    qrbox:250
  },
  (decodedText) => {

    alert(
      "QR leído:\n\n" +
      decodedText
    );

    registrar(decodedText);

  }
);

  } catch(err){

    alert(err);
  }
}

async function registrar(id){

  const ahora = Date.now();

if(
  id === ultimoEscaneo &&
  ahora - ultimoTiempo < 5000
){
  return;
}

ultimoEscaneo = id;
ultimoTiempo = ahora;
  try{

    await fetch(URL_API,{

      method:"POST",

      mode:"no-cors",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        id:id
      })

    });

    document
      .getElementById("estado")
      .innerHTML =
      "✅ ASISTENCIA REGISTRADA";

    document
      .getElementById("detalle")
      .innerHTML =
      "Código: " + id;

    reproducirBeep();

  }catch(err){

    document
      .getElementById("estado")
      .innerHTML =
      "❌ ERROR";

  }

}

</script>

  function reproducirBeep(){

  const audio =
    new Audio(
      "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    );

  audio.play();

}
</body>
</html>
