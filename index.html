<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
  
<meta name="viewport"
      content="width=device-width, initial-scale=1">  
  
<title>Control de Asistencia</title>

<script src="https://unpkg.com/html5-qrcode"></script>
</head>

<style>

body {

  font-family: Arial, sans-serif;

  text-align: center;

  margin: 0;

  padding: 15px;

}

h2 {

  font-size: 28px;

}

button {

  font-size: 22px;

  padding: 15px 25px;

  border-radius: 10px;

  border: none;

}

#reader {

  width: 100% !important;

  max-width: 450px;

  margin: auto;

}

#estado {

  font-size: 30px;

  margin-top: 20px;

}

#detalle {

  font-size: 24px;

  margin-top: 10px;

}

</style>
  
<body>

<h2>Asistencia Curso de Liderazgo 10 hrs</h2>

<button onclick="iniciarCamara()">
Activar cámara

<button onclick="reproducirBeep()">
Probar sonido  
</button>
  
<div id="reader" style="width:350px;"></div>

<h3 id="estado"></h3>

<div id="detalle"></div>

<script>
  
const URL_API =
"https://script.google.com/macros/s/AKfycbzTgCn8MqS0Tn6gR55QHNxckAS96JR_SvbiEKO8CvkDbafLqPkxaqiktcv518ULlE47/exec";

async function probarAPI() {

  alert("Entré a probarAPI");

  try {

    const resp = await fetch(
      URL_API,
      {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id: "CAP001"
        })
      }
    );

    alert("Petición enviada");

  } catch(err) {

    alert(
      err.name +
      "\n\n" +
      err.message
    );

  }

}
  
let iniciado = false;

let ultimoEscaneo = "";
let ultimoTiempo = 0;  

async function iniciarCamara() {

  if(iniciado) return;

  iniciado = true;

  const qr =
    new Html5Qrcode("reader");

  try {

  await qr.start(
  {
    facingMode:"environment"
  },
  {
    fps:10,
    qrbox:250
  },
 (decodedText) => {

  registrar(decodedText);

}
);

  } catch(err){

    alert(err);
  }
}

async function registrar(id){

  const ahora = Date.now();

if(
  id === ultimoEscaneo &&
  ahora - ultimoTiempo < 5000
){
  return;
}

ultimoEscaneo = id;
ultimoTiempo = ahora;
  try{

    await fetch(URL_API,{

      method:"POST",

      mode:"no-cors",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        id:id
      })

    });

    document
      .getElementById("estado")
      .innerHTML =
      "✅ REGISTRO EXITOSO";

    document
      .getElementById("detalle")
      .innerHTML =
      "Código: " + id;

    reproducirBeep();

    setTimeout(() => {

  document
    .getElementById("estado")
    .innerHTML = "";

  document
    .getElementById("detalle")
    .innerHTML = "";

}, 3000);
    
  }catch(err){

    document
      .getElementById("estado")
      .innerHTML =
      "❌ ERROR";

  }

}

function reproducirBeep() {

  try {

    const contexto = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    const oscilador =
      contexto.createOscillator();

    const ganancia =
      contexto.createGain();

    oscilador.connect(ganancia);

    ganancia.connect(
      contexto.destination
    );

    oscilador.frequency.value = 800;

    oscilador.start();

    setTimeout(() => {

      oscilador.stop();

    }, 150);

  } catch(err) {

    console.log(err);

  }

}
  
</script>

</body>
</html>
